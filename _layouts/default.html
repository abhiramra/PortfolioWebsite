<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body{% if page.no_masthead %} class="is-home"{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>

  {% unless page.no_masthead %}
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="masthead-name" href="{{ site.baseurl }}/">{{ site.title }}</a>
      <nav class="masthead-nav" aria-label="Primary">
        <a href="{{ site.baseurl }}/">Work</a>
        <a href="{{ site.baseurl }}/resume/">Résumé</a>
      </nav>
    </div>
  </header>
  {% endunless %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
