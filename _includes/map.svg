{%- comment -%}
  Hand-authored inline survey map, generated once from Natural Earth admin-1 states
  (Indian states + Illinois) and US counties (Champaign, FIPS 17019), projected per
  panel with a d3-geo Mercator, coordinates rounded to 1dp. The generator was then
  deleted per the brief. Each pin is an <a> with a native <title>; styling and the
  hover/focus states live in assets/css/main.css. See README.md to edit it.
{%- endcomment -%}
<svg viewBox="0 0 1000 700" class="map" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="map-title map-desc">
<title id="map-title">A map of where the work happened</title>
<desc id="map-desc">Three antique survey panels — South India, a Greater Bengaluru inset, and Illinois. Large pins mark places worked or built; small open circles and a dotted area mark where the work was deployed. Every pin is a link and the same destinations are listed as text below the map.</desc>
