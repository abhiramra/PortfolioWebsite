<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{% if page.summary %}{{ page.summary | strip_html | truncate: 160 }}{% else %}{{ site.description | strip_newlines }}{% endif %}">
<meta name="author" content="{{ site.author }}">

<!-- Type: EB Garamond (serif) + Cutive Mono (typewriter mono, period-correct) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">

<!-- Inline SVG favicon: a survey pin. No external request, no script. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23F4EDDD'/%3E%3Ccircle cx='8' cy='8' r='3.2' fill='%239E3B22'/%3E%3C/svg%3E">
