<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{% if page.card_line %}{{ page.card_line | strip_html }}{% else %}{{ site.description | strip_newlines }}{% endif %}">
<meta name="author" content="{{ site.author }}">
<meta name="theme-color" content="#FAF8F5">

<!-- Type: Newsreader (editorial serif, titles + body) + IBM Plex Mono (metadata) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">

<!-- Inline SVG favicon: an accent frame on ink. No external request, no script. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%231A1917'/%3E%3Crect x='3.25' y='3.25' width='9.5' height='9.5' rx='1' fill='none' stroke='%23B4442A' stroke-width='1.4'/%3E%3C/svg%3E">
