# --- Site ---------------------------------------------------------------
title: Abhiram Rachamadugu
tagline: "Engineer and entrepreneur with experience in autonomy, aerospace and automotive sectors"
description: >-
  The portfolio of Abhiram Rachamadugu — engineering across aerospace,
  autonomy, thermal systems, materials, manufacturing, software and
  nonprofit operations. Eleven projects, including the parts that did not work.
author: Abhiram Rachamadugu
lang: en

# --- URLs ---------------------------------------------------------------
# Domain-agnostic. Leave both empty for a custom domain or a user/org page.
# For a PROJECT page (username.github.io/repo-name) set:
#   baseurl: "/repo-name"
# Every internal link uses {{ site.baseurl }}, so this one value is the only
# thing to change when the custom domain is purchased.
baseurl: ""
url: "https://abhiramra.net"

# --- Contact (footer + résumé) -----------------------------------------
# Two phone numbers, per Abhiram. Read by _includes/footer.html and
# _layouts/resume.html.
contact:
  email: abhiramra@gmail.com
  phone_in: "+91 88008 26446"
  phone_us: "+1 217 888 0449"
  linkedin: https://www.linkedin.com/in/rachabhi/
  github: https://github.com/abhiramra
  location: Bengaluru, India / Urbana-Champaign, IL
resume_pdf: "/assets/Abhiram-Rachamadugu-Resume.pdf"

# --- Build --------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  projects:
    output: true
    permalink: /work/:name/

# Layout applied automatically so collection files need no `layout:` field.
defaults:
  - scope: { path: "", type: "projects" }
    values: { layout: project }

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
  - tools             # image pipeline — build-time helper, not published
  - out               # cowork's staging output — incorporated, not published
